<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Le Mie Finanze</title>
<meta name="description" content="App personale di finanza — conti, spese, debiti, pagamenti futuri e portafoglio.">
<meta name="theme-color" content="#1F6F5C" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16191A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanze">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<script>
// Imposta il tema PRIMA che la pagina venga disegnata, così non si vede mai
// un lampo con il tema sbagliato. app.js (caricato dopo) legge la stessa chiave.
(function () {
  try {
    var pref = localStorage.getItem('finanze-tema') || 'auto';
    var known = ['verde', 'blu', 'scuro', 'minimal'];
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = known.indexOf(pref) > -1 ? pref : (dark ? 'scuro' : 'verde');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
